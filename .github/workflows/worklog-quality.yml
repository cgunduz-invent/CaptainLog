name: Worklog Giriş Disiplini Raporu

on:
  schedule:
    # Her iş günü 06:30 UTC = 09:30 TR (Pzt–Cum). TR saatini değiştirmek için
    # cron'u UTC olarak ayarla (TR = UTC+3).
    - cron: "30 6 * * 1-5"
  workflow_dispatch:        # elle tetikleme (test için)

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Raporu çalıştır ve Slack'e bas
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: python worklog_quality_report.py
